name: Custom Filament Profile Creator

on:
  push:
    branches:
      - main
      - 'feature/filament-economy'
    paths:
      - 'tools/sds-importer/**'
      - '.github/workflows/build_sds_importer.yml'
    tags:
      # New canonical tag (post-rename, v0.1.2+).
      - 'profile-creator-v*'
      # Legacy tag prefix retained so historical tag pushes still build.
      - 'sds-importer-v*'
  pull_request:
    paths:
      - 'tools/sds-importer/**'
      - '.github/workflows/build_sds_importer.yml'
  workflow_dispatch:

concurrency:
  group: sds-importer-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Use the ayatana variant of appindicator and skip the older
          # libappindicator3-dev which conflicts with it on Ubuntu 24.04.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/sds-importer/src-tauri

      - name: cargo check
        working-directory: tools/sds-importer/src-tauri
        run: cargo check --all-targets

      - name: cargo test
        working-directory: tools/sds-importer/src-tauri
        run: cargo test --verbose -- --nocapture

  build-release:
    name: Build release (${{ matrix.os }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/profile-creator-v') || startsWith(github.ref, 'refs/tags/sds-importer-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: leanspectrum-sds-importer_linux-amd64
            bundle-glob: |
              tools/sds-importer/src-tauri/target/release/bundle/appimage/*.AppImage
              tools/sds-importer/src-tauri/target/release/bundle/deb/*.deb
              tools/sds-importer/src-tauri/target/release/bundle/rpm/*.rpm
          - os: macos-14
            artifact-name: leanspectrum-sds-importer_macos-arm64
            bundle-glob: tools/sds-importer/src-tauri/target/release/bundle/dmg/*.dmg
          - os: macos-13
            artifact-name: leanspectrum-sds-importer_macos-intel
            bundle-glob: tools/sds-importer/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            artifact-name: leanspectrum-sds-importer_windows-amd64
            bundle-glob: |
              tools/sds-importer/src-tauri/target/release/bundle/msi/*.msi
              tools/sds-importer/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Use the ayatana variant of appindicator and skip the older
          # libappindicator3-dev which conflicts with it on Ubuntu 24.04.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/sds-importer/src-tauri

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Generate platform icon variants from source
        working-directory: tools/sds-importer
        run: cargo tauri icon icons-source.png

      - name: Build release bundle
        working-directory: tools/sds-importer
        run: cargo tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: warn
          path: ${{ matrix.bundle-glob }}

  publish-release:
    name: Publish GitHub release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/profile-creator-v') || startsWith(github.ref, 'refs/tags/sds-importer-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
                                    -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SDS Importer ${{ github.ref_name }}
          body_path: tools/sds-importer/CHANGELOG.md
          generate_release_notes: true
          append_body: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: release-assets/*
