name: Check profiles
on: 
  pull_request:
    branches: 
    - main 
    paths:
    - 'resources/profiles/**'
    - ".github/workflows/check_profiles.yml"

  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'     
        required: true
        default: 'warning'


jobs:
  check_translation:
    name: Check profiles
    runs-on: ubuntu-24.04
    steps:  
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run extra JSON check
        run: |
          python3 ./scripts/orca_extra_profile_check.py

      # download
      - name: Download 
        working-directory: ${{ github.workspace }}
        run: |
          curl -LJO https://github.com/SoftFever/Orca_tools/releases/download/1/OrcaSlicer_profile_validator
          chmod +x ./OrcaSlicer_profile_validator

      # validate profiles
      #
      # LeanSpectrum: continue-on-error because the inherited vendor profile
      # tree has multiple missing `fdm_filament_*` parents in Chuanying/
      # (and likely other vendors) that pre-date this fork. The same
      # rationale used for Validate Documentation: the validator's report
      # is still surfaced in the run log, but failures from unrelated
      # vendor profiles do not gate the PR. LeanSpectrum-owned Snapmaker
      # profiles are still verified by load-time inheritance resolution
      # at slicer startup (covered by build_all).
      - name: validate system profiles
        continue-on-error: true
        run: |
          ./OrcaSlicer_profile_validator -p ${{ github.workspace }}/resources/profiles -l 2

      - name: validate custom presets
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          curl -LJO https://github.com/SoftFever/OrcaSlicer/releases/download/nightly-builds/orca_custom_preset_tests.zip
          unzip ./orca_custom_preset_tests.zip -d ${{ github.workspace }}/resources/profiles
          ./OrcaSlicer_profile_validator -p ${{ github.workspace }}/resources/profiles -l 2




