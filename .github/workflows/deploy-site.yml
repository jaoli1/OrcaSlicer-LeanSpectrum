name: Deploy site to Cloudflare Pages

# Optional git-tracked deployment workflow. The recommended setup is the
# Cloudflare Pages dashboard git connector (no workflow file needed, just
# point CF Pages at the repo + branch + output dir). This file exists so
# the deployment config travels with the repo and we don't lose it if
# the dashboard is reconfigured.
#
# To enable:
#   1. Sign up at https://dash.cloudflare.com and add maisondrabiec.fr
#   2. Workers & Pages → Create → Pages → Connect to Git → select this repo
#   3. Add two repo secrets:
#      - CLOUDFLARE_API_TOKEN  (Pages:Edit + Account:Read scopes)
#      - CLOUDFLARE_ACCOUNT_ID (visible on any Cloudflare dashboard page)
#   4. Add the DNS CNAME at Cloudflare: slicer → <project>.pages.dev (proxied)
#   5. Map the custom domain slicer.maisondrabiec.fr in the Pages project
#
# Once those exist, this workflow ships every push to main as production
# and every PR as a preview at https://<hash>.<project>.pages.dev.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    name: Publish site/ to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static site
        run: |
          # Sanity-check the two files exist and reference each other.
          # We don't run a full HTML validator because the page already
          # passed manual review with SEO + a11y agents; this catches
          # the case where a future PR deletes one of the two files by
          # accident.
          test -f site/index.html
          test -f site/style.css
          grep -q 'href="style.css"' site/index.html
          grep -q '<title>' site/index.html
          grep -q 'application/ld+json' site/index.html
          echo "site/ structural checks passed"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: leanspectrum-site
          directory: site
          # Production deploys come from main; everything else creates
          # a preview deploy that posts a comment back to the PR.
          branch: ${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
