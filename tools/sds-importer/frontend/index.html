<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeanSpectrum SDS Importer</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafafa;
      --fg: #1a1a1a;
      --accent: #d35400;
      --muted: #777;
      --panel: #fff;
      --border: #e4e4e4;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#181818; --fg:#eee; --panel:#222; --border:#333; }
    }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg);
                 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 24px; }
    h1 { font-weight: 600; font-size: 1.4rem; margin-bottom: 4px; }
    p.sub { color: var(--muted); margin-top: 0; }
    .drop {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s;
    }
    .drop.hover { border-color: var(--accent); }
    .row { display: flex; gap: 12px; align-items: center; margin: 12px 0; }
    button {
      background: var(--accent); color: white; border: 0; padding: 10px 18px;
      border-radius: 8px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px; margin-top: 16px;
    }
    code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .log { font-size: 0.85rem; max-height: 180px; overflow-y: auto;
           background: rgba(0,0,0,0.04); padding: 10px; border-radius: 8px; }
    label { display: flex; align-items: center; gap: 6px; }
    .field { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--border); }
    .field span:first-child { color: var(--muted); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; }
    .badge.review { background: #f39c12; color: white; }
    .badge.ok { background: #27ae60; color: white; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>LeanSpectrum SDS / TDS Importer</h1>
    <p class="sub">Drop a filament Safety or Technical Data Sheet PDF; get a Snapmaker_Orca filament profile.</p>

    <div id="drop" class="drop">
      <div>Drop a <strong>.pdf</strong> here, or click to pick a file.</div>
      <div id="pickedPath" class="sub" style="margin-top: 8px;"></div>
    </div>

    <div class="row">
      <label><input id="fetchOnline" type="checkbox" checked /> Also look for the manufacturer's TDS online (recommended)</label>
    </div>

    <div class="row">
      <button id="run" disabled>Create filament profile</button>
      <span id="status" class="sub"></span>
    </div>

    <div id="result" class="panel" style="display:none;"></div>
    <div id="logPanel" class="panel" style="display:none;">
      <strong>Log</strong>
      <div id="log" class="log"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
