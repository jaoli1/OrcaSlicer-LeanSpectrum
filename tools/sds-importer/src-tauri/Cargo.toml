[package]
name        = "leanspectrum-sds-importer"
version     = "0.1.0"
edition     = "2021"
description = "Turns filament SDS/TDS PDFs into Snapmaker_Orca filament profiles"
license     = "AGPL-3.0-or-later"
authors     = ["LeanSpectrum contributors"]
publish     = false

[lib]
name       = "leanspectrum_sds_importer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri        = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "1"
anyhow       = "1"
once_cell    = "1"
regex        = "1"
log          = "0.4"
env_logger   = "0.11"
chrono       = { version = "0.4", features = ["serde"] }
dirs         = "5"

# PDF text extraction (born-digital documents).
pdf-extract  = "0.7"

# Tesseract OCR — fallback for scanned PDFs.
# tesseract crate calls the system tesseract binary; we do not statically
# link the lib so users keep upgrade control over their OCR engine.
tesseract    = { version = "0.15", default-features = false }

# Image conversion (PDF page -> PNG -> OCR).
image        = "0.25"
pdfium-render = { version = "0.8", features = ["sync"], optional = true }

# Optional HTTP for manufacturer URL fetch.
reqwest      = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper      = "0.20"

[features]
default = ["pdfium"]
# Use pdfium for higher-fidelity PDF rendering before OCR. Falls back to
# pdf-extract text path when disabled.
pdfium  = ["dep:pdfium-render"]

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true
