[package]
name        = "custom-filament-profile-creator"
version     = "0.1.5"
edition     = "2021"
description = "Creates Snapmaker_Orca filament profiles tailored to each vendor's SDS/TDS PDF"
license     = "AGPL-3.0-or-later"
authors     = ["LeanSpectrum contributors"]
publish     = false

[lib]
name       = "custom_filament_profile_creator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri        = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "1"
anyhow       = "1"
once_cell    = "1"
regex        = "1"
log          = "0.4"
env_logger   = "0.11"
chrono       = { version = "0.4", features = ["serde"] }
dirs         = "5"

# PDF text extraction (born-digital documents).
pdf-extract  = "0.7"

# Tesseract OCR — fallback for scanned PDFs. Optional because the
# leptonica-sys + tesseract-sys system dependencies are non-trivial to
# install across CI runners (apt vs brew vs vcpkg). Most vendor SDS/TDS are
# born-digital, so prebuilt binaries ship without OCR and users who need it
# rebuild with `cargo tauri build --features ocr`.
tesseract    = { version = "0.15", default-features = false, optional = true }

# Image conversion (PDF page -> PNG -> OCR).
image        = "0.25"
pdfium-render = { version = "0.8", features = ["sync"], optional = true }

# Optional HTTP for manufacturer URL fetch.
reqwest      = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper      = "0.20"

[features]
default = ["pdfium"]
# Use pdfium for higher-fidelity PDF rendering before OCR. Falls back to
# pdf-extract text path when disabled.
pdfium  = ["dep:pdfium-render"]
# OCR via the system Tesseract install. Adds a system-library compile
# dependency on leptonica.
ocr     = ["dep:tesseract"]

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true
